<!-- Use https://schema.org/Person for more options here -->
<div itemscope itemtype="https://schema.org/Person" class="author-embed">

	<% if(data.image) { %>
		<a href="<%= data.permalink %>">
			<img class="author-image" itemprop="image" src="<%= data.image.src %>" alt="<%= data.title %>"/>
		</a>
		<br/>
	<% } %>

	<a href="<%= data.permalink %>" class="author-title">
		<span itemprop="name"><%= data.title %></span>
	</a>

	<% if(data.tagline) { %>
		<p class="author-tagline"><%= data.tagline %></p>
	<% } %>


	<% if(data.get('socials', null)) { %>
		<ul class="author-profiles">
			<% Object.keys(data.socials).forEach(function(key) { %>
				<li>
					<a itemprop="url" href="<%= data.socials[key] %>" title="<%= data.title %> on <%= key %>" target="_blank">
						<i is="cms-icon" icon="<%= key %>"></i>
					</a>
				</li>
			<% }) %>
		</ul>
	<% } %>
</div>
