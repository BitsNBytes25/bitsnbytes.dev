	<script>
		// Setup config from server

		// Setup all page types supported by this theme

		// Inform the CMS that the configuration is ready.
		CMS.init();
	</script>

	<script>
		// Common scripts; move these to the CMS core if needed in other themes
		const truncate = (str, max = 10) => {
			const array = str.trim().split(' ');
			const ellipsis = array.length > max ? '...' : '';

			return array.slice(0, max).join(' ') + ellipsis;
		};

		// Close the menu when a link is clicked
		document.querySelectorAll('.site-nav a').forEach(function(link) {
			link.addEventListener('click', function() {
				document.getElementById('menu-toggle').checked = false;
			});
		});

		document.addEventListener('cms:route', () => {
			let searchIcon = document.querySelector('.search-group i');
			if (searchIcon) {
				searchIcon.addEventListener('click', function () {
					let searchInput = document.querySelector('.search-group input');
					if (searchInput && searchInput.value) {
						searchInput.search();
					}
				});
			}
		});

		document.addEventListener('cms:pagelist:loaded', e => {
			if (e.detail.type === 'sponsors') {
				let intersectionObserver = new IntersectionObserver(entries => {
						if (entries[0].isIntersecting) {
							// Image is within the viewport, but check if it's still there in a couple seconds too.
							// If no that indicates the user just scrolled by without looking.
							let target = entries[0].target;
							setTimeout(() => {
								if (target.offsetTop < (window.scrollY + window.innerHeight) && (target.offsetTop + target.offsetHeight) > window.scrollY) {
									// Still in view, so count as a view
									let ad = target.dataset.ad;
									if (ad) {
										// Push somewhere
										if (typeof(window._paq) !== 'undefined') {
											// Matomo tracking
											_paq.push(['trackEvent', 'Sponsor', 'View', ad]);
										}
									}
								}
							}, 2000);
						}
					}),
				sponsor = document.querySelector('.sponsor-placement');
				if (sponsor) {
					intersectionObserver.observe(sponsor);
				}
			}
		});
	</script>
